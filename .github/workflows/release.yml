# Release pipeline, adapted from DivineDragonFanClub/dddioxus with an Android job added.
# Manually dispatched: pick a tag, it builds Windows + macOS desktop and an Android APK
# and attaches them to the GitHub release for that tag.
#
# Keep the dioxus-cli version below matched to the `dioxus` version in Cargo.toml, dx
# errors on a mismatch.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      prerelease:
        description: "Mark the release as a prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Keep the checked-in Cargo.toml version in step with the tag being released. If they differ, bump
  # Cargo.toml + Cargo.lock and push that commit back to the branch, so the source always reflects
  # what shipped. The build jobs check out this commit. GITHUB_TOKEN pushes don't re-trigger
  # workflows, so this can't loop.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Bump version to match tag
        id: bump
        run: |
          set -euo pipefail
          ver="${{ inputs.tag }}"; ver="${ver#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          current=$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          echo "Tag version: $ver, Cargo.toml version: $current"
          if [ "$current" = "$ver" ]; then
            echo "Already in sync, nothing to commit"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -E "s/^version = \".*\"/version = \"$ver\"/" Cargo.toml
          # bump our own package entry in the lockfile too (the version line right after its name),
          # so the first cargo run in the build jobs doesn't have to rewrite Cargo.lock
          awk -v v="$ver" '
            /^name = "CobaltManager"$/ { print; getline; sub(/^version = ".*"/, "version = \"" v "\""); print; next }
            { print }
          ' Cargo.lock > Cargo.lock.tmp && mv Cargo.lock.tmp Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $ver"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    # .cargo/config.toml sets a nightly-only `-Z threads=8` rustflag for the windows
    # target. This lets the stable CI toolchain accept it without changing the repo.
    env:
      RUSTC_BOOTSTRAP: "1"
    steps:
      # check out the version-bump commit so Cargo.toml already carries the tag's version
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@0.7.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-hub's Windows updater runs the downloaded asset as an .exe with elevation (ShellExecute
      # runas), so the self-update asset is an NSIS installer (.exe), not an MSI (which would need
      # msiexec). dx builds the NSIS bundle via cargo-packager (it fetches NSIS on its own).
      - name: Bundle NSIS installer
        run: dx bundle --release --platform desktop --package-types nsis --out-dir out-bundle

      - name: Name the installer for release-hub
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path out-bundle -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found under out-bundle" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $exe.FullName "out/CobaltManager-windows-x86_64.exe"

      - name: Check for minisign secret
        shell: bash
        run: |
          if [ -n "${{ secrets.MINISIGN_SECRET_KEY }}" ]; then
            echo "HAS_MINISIGN=true" >> "$GITHUB_ENV"
          else
            echo "::warning::MINISIGN_SECRET_KEY not set, the Windows installer won't be self-update signed"
            echo "HAS_MINISIGN=false" >> "$GITHUB_ENV"
          fi

      # Detached minisign signature next to the installer. minisign isn't on the runner, so grab the
      # official prebuilt. Passwordless key (minisign -G -W) keeps signing non-interactive.
      - name: Sign updater asset (minisign)
        if: env.HAS_MINISIGN == 'true'
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-win64.zip" -OutFile minisign.zip
          Expand-Archive minisign.zip -DestinationPath minisign-bin -Force
          $minisign = (Get-ChildItem -Path minisign-bin -Recurse -Filter minisign.exe | Select-Object -First 1).FullName
          [IO.File]::WriteAllText("minisign.key", $env:MINISIGN_SECRET_KEY.TrimEnd() + "`n")
          & $minisign -S -s minisign.key -m out/CobaltManager-windows-x86_64.exe
          if ($LASTEXITCODE -ne 0) { throw "minisign signing failed" }
          Remove-Item minisign.key
          Get-ChildItem out

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          # point the tag at the version-bump commit so the release matches the shipped version
          target_commitish: ${{ needs.version.outputs.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            out/*.exe
            out/*.minisig
          # minisig is absent when MINISIGN_SECRET_KEY isn't set, so don't fail on a missing glob.
          fail_on_unmatched_files: false

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      # check out the version-bump commit so Cargo.toml already carries the tag's version
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main
      - name: Install dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall -y --force --targets aarch64-apple-darwin dioxus-cli@0.7.9
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/dx" --version

      - name: Bundle both arches
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          dx bundle --release --platform desktop --package-types macos \
            --target aarch64-apple-darwin --out-dir out-arm
          dx bundle --release --platform desktop --package-types macos \
            --target x86_64-apple-darwin --out-dir out-x64

      - name: Merge into a universal .app
        run: |
          set -euo pipefail
          app_name=$(basename "$(ls -d out-arm/*.app | head -1)")
          bin=$(ls "out-arm/$app_name/Contents/MacOS" | head -1)
          lipo -create \
            "out-arm/$app_name/Contents/MacOS/$bin" \
            "out-x64/$app_name/Contents/MacOS/$bin" \
            -output "out-arm/$app_name/Contents/MacOS/$bin"
          lipo -info "out-arm/$app_name/Contents/MacOS/$bin"
          echo "APP_NAME=$app_name" >> "$GITHUB_ENV"

      # Register the app as the nxm:// handler (NexusMods "Mod Manager Download"). dx's [deep_links]
      # only wires this into the mobile manifests, not the desktop .app, so we inject
      # CFBundleURLTypes here. Must run BEFORE signing so the signature covers the change (same steps
      # as macos/build.sh).
      - name: Register nxm:// URL scheme
        run: |
          set -euo pipefail
          plist="out-arm/$APP_NAME/Contents/Info.plist"
          pb=/usr/libexec/PlistBuddy
          $pb -c "Delete :CFBundleURLTypes" "$plist" 2>/dev/null || true
          $pb -c "Add :CFBundleURLTypes array" "$plist"
          $pb -c "Add :CFBundleURLTypes:0 dict" "$plist"
          $pb -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.divinedragonfanclub.nxm" "$plist"
          $pb -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$plist"
          $pb -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string nxm" "$plist"
          plutil -lint "$plist"

      # Signs + notarizes so the app opens with no Gatekeeper warning. Skipped (leaving an
      # unsigned zip) if the signing secrets aren't set. See docs/macos-signing.md.
      - name: Check for signing secrets
        run: |
          if [ -n "${{ secrets.MACOS_CERT_P12 }}" ]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::warning::MACOS_CERT_P12 not set, the macOS app will be unsigned/unnotarized"
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
          fi
          # Minisign key for self-update. Without it we still ship the app, just without the .minisig
          # sidecars, so release-hub finds no verifiable asset and the in-app updater stays dormant.
          if [ -n "${{ secrets.MINISIGN_SECRET_KEY }}" ]; then
            echo "HAS_MINISIGN=true" >> "$GITHUB_ENV"
          else
            echo "::warning::MINISIGN_SECRET_KEY not set, the macOS app won't be self-update signed"
            echo "HAS_MINISIGN=false" >> "$GITHUB_ENV"
          fi

      - name: Sign, notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="out-arm/$APP_NAME"

          # import the Developer ID cert into a throwaway keychain
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null

          # sign with the hardened runtime + a secure timestamp (both required to notarize)
          codesign --force --deep --options runtime --timestamp --sign "$SIGN_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # notarize (blocks until Apple finishes) then staple the ticket onto the app
          ditto -c -k --keepParent "$app" notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

      # release-hub's macOS installer extracts a ZIP, so the self-update asset is a `.app.zip` whose
      # name contains the target string (darwin-aarch64 / darwin-x86_64). The .app is universal, so we
      # publish the same zip under both arches; the updater downloads whichever matches the host.
      - name: Zip the app (updater assets)
        run: |
          set -euo pipefail
          mkdir -p out
          base="${APP_NAME%.app}"
          ( cd out-arm && ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "../out/${base}-darwin-aarch64.app.zip" )
          cp "out/${base}-darwin-aarch64.app.zip" "out/${base}-darwin-x86_64.app.zip"

      # Detached minisign signature next to each asset (release-hub verifies it against MINISIGN_PUBKEY
      # baked into the app). Uses a passwordless key (generated with `minisign -G -W`) so signing is
      # non-interactive. Legacy signatures are accepted, so no -H is needed.
      - name: Sign updater assets (minisign)
        if: env.HAS_MINISIGN == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          # grab the official prebuilt minisign instead of `brew install` (Homebrew warns about
          # untrusted taps pre-installed on the runner, and a direct download is faster anyway)
          curl -sL "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-macos.zip" -o minisign.zip
          unzip -o minisign.zip minisign -d minisign-bin
          chmod +x minisign-bin/minisign
          ms="$PWD/minisign-bin/minisign"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          for f in out/*.app.zip; do
            "$ms" -S -s minisign.key -m "$f"
          done
          rm -f minisign.key
          ls -l out

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          # point the tag at the version-bump commit so the release matches the shipped version
          target_commitish: ${{ needs.version.outputs.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            out/*.app.zip
            out/*.minisig
          # minisigs are absent when MINISIGN_SECRET_KEY isn't set, so don't fail on a missing glob.
          fail_on_unmatched_files: false

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      # check out the version-bump commit so Cargo.toml already carries the tag's version
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK / platform / build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: cargo-bins/cargo-binstall@main
      - name: Install dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall -y --force dioxus-cli@0.7.9
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # android/build.sh does `dx build --release`, overlays the SAMMIE launcher icon (dx
      # has no config for it), and runs assembleRelease with minify off, signed with the
      # debug key. See the script for why. Produces a ~8MB release APK.
      - name: Build Android APK
        run: bash android/build.sh

      - name: Collect APK
        run: |
          mkdir -p out
          cp target/dx/CobaltManager/release/android/app/app/build/outputs/apk/release/app-release.apk \
             out/CobaltManager-android.apk

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          # point the tag at the version-bump commit so the release matches the shipped version
          target_commitish: ${{ needs.version.outputs.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: out/*.apk
          fail_on_unmatched_files: true
