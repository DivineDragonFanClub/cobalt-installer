[package]
name = "CobaltInstaller"
version = "2.3.0"
authors = ["DogeThis <thedogethis@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# keep this matched to the installed dx CLI version, dx warns loudly on a mismatch
dioxus = { version = "0.7.9" }
dirs = "5.0.1"
zip = "2.2.2"
# rustls instead of the default native-tls so the Android build doesn't have to
# cross-compile OpenSSL. Desktop is happy with rustls too. json/stream are for the
# GameBanana API and the streaming mod download.
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Shared by the mod browser on both platforms now: serde for the GameBanana API + config.yaml,
# serde_yaml to write configs Cobalt can read, futures-util to consume the download byte stream,
# serde_json for the SAF directory listing / update-check, anyhow for the API + JNI error plumbing.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures-util = "0.3"
anyhow = "1"

# Desktop-only deps. The Android build doesn't pull these in, so nothing here
# needs to cross-compile for android.
[target.'cfg(not(target_os = "android"))'.dependencies]
dioxus-desktop = "0.7.9"
dioxus-sdk = { version = "0.7.0", features = ["storage", "time"] }
# System clipboard for "Copy mod list" (dioxus-sdk 0.7 has no clipboard feature).
arboard = { version = "3", default-features = false }
# dev bridge: lets external tools (MCP debuggers) eval JS in the running app.
# desktop-only, and the wiring is additionally gated to debug_assertions.
dioxus-inspector = { version = "0.1.2", optional = true }
# oneshot channel to await a blocking FTP upload that runs on its own thread (keeps the UI live).
futures-channel = "0.3"
# Plain FTP client for installing straight to a modded console (sys-ftpd, anonymous:5000). No TLS
# feature, the console's FTP is unencrypted on the LAN. The blocking client runs on its own thread.
suppaftp = "6"
# Just for enumerating removable drives (SD card / USB) in the volume picker. Only the disk feature.
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
# Self-update the installer from its own GitHub releases (minisign-signed assets). Points at our fork
# because crates.io release-hub 0.3.0 doesn't compile on Windows (a bad &HSTRING -> PCWSTR conversion).
release-hub = { git = "https://github.com/DivineDragonFanClub/release-hub", rev = "de1e31d" }
# reqwest (ring) and release-hub's stack (aws-lc-rs) both enable a rustls crypto provider, so rustls
# can't auto-pick one. We install a process-default provider in main() before any TLS use.
rustls = "0.23"

# Android-only native plumbing. `jni`/`ndk-context` bridge into MainActivity.kt,
# `futures-timer` gives us an await-able delay for polling the folder grant.
# Pin `android-activity` to whatever dioxus-mobile/tao resolve (check Cargo.lock
# after the first android build) so there's only one JavaVM/context registry.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
futures-timer = "3"

# Only for the network-gated smoke test (install::tests::live_install_roundtrip), which needs an
# async runtime to drive reqwest. Not part of the shipped app.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "dep:dioxus-inspector"]
mobile = ["dioxus/mobile"]

[profile]

[profile.release]
opt-level = 0
debug = 1
lto = false
codegen-units = 256
panic = "abort"
strip = false
incremental = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
