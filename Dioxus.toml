[application]

# App (Project) Name
name = "Cobalt Manager"
default_platform = "desktop"

# Android: we only override MainActivity (it owns the folder picker and the SAF
# file writes). We do NOT supply a custom manifest, dx's default already adds the
# INTERNET permission and the right AppCompat theme/icon, and that's all we need
# (SAF needs no storage permission). min sdk 29 (Android 10) covers the SAF APIs.
android_main_activity = "android/MainActivity.kt"
android_min_sdk_version = 29

[bundle]
identifier = "com.divinedragonfanclub"
publisher = "Divine Dragon Fan Club"
# Windows picks the .ico (exe, Start Menu shortcut, taskbar, Add/Remove), the .png covers
# macOS/Linux. Both are the same SAMMIE face so the app looks the same on every platform.
# Without the .ico the Windows build ships with no icon at all.
icon = ["assets/SAMMIE.png", "assets/SAMMIE.ico"]

# Install WebView2 silently. dx defaults to running the WebView2 installer with its UI visible, which
# throws a scary "already installed" dialog on the many machines that already have it (Win11 always,
# most Win10). silent = true makes it quietly do nothing when present and only install when it's
# really missing (the app needs it to render). Same offline-installer mode dx uses by default, just
# silenced. This enum is externally tagged, so the shape is { Variant = { ... } }, not a "type" key.
[bundle.windows]
webview_install_mode = { OfflineInstaller = { silent = true } }

# Windows installer specifics. dx forces the product name (and so the Start Menu shortcut) to a
# spaceless PascalCase "CobaltManager", with no config knob to change it. So we point NSIS at a
# forked template that hardcodes the nice spaced "Cobalt Manager" name for the shortcuts + the
# Add/Remove entry. start_menu_folder makes the Start Menu group match. See windows/installer.nsi.
[bundle.windows.nsis]
template = "windows/installer.nsi"
start_menu_folder = "Cobalt Manager"

# Register the app as the handler for nxm:// links (NexusMods "Mod Manager Download"). dx maps this
# to CFBundleURLTypes in the macOS Info.plist and an intent-filter on Android. The Rust side catches
# the link via the Opened event in Body (src/main.rs). Only takes effect in a bundled build
# (dx bundle), a dev `dx serve` app isn't registered with the OS as a URL handler.
[deep_links]
schemes = ["nxm"]

[web.app]

# HTML title tag content
title = "Cobalt Manager"

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []